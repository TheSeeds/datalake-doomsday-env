{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "postgresql.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  #: Forbid: um dump já em curso basta. Paralelo só gastaria I/O competindo
  #: com a ingestão.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "postgresql.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dump
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              # `IfNotPresent` de propósito: a imagem é construída localmente e
              # importada no containerd do microk8s (`ctr images import`). Sem
              # esta política o kubelet tenta o registry, recebe um 404 em HTML
              # e falha com "unexpected media type text/html" — erro que não
              # menciona backup nenhum e custou horas de diagnóstico.
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              envFrom:
                - secretRef:
                    name: {{ .Values.auth.existingSecret }}
              env:
                #: Destino: `backup/` no Garage, nunca no PVC do banco. Backup no
                #: mesmo disco do original não é backup.
                - name: GARAGE_S3_ENDPOINT
                  value: http://garage:3900
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lakecore-s3-verify
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lakecore-s3-verify
                      key: S3_SECRET_KEY
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  # `set -eu` sem `-x`: `-x` imprime o comando expandido, e o
                  # `PGPASSWORD=... pg_dump ...` colocaria a senha no log do Job.
                  # Durante o teste isso aconteceu de fato.
                  set -eu
                  # Registro de falha no EXIT: cobre aborto por `set -e`, dump
                  # vazio (`test -s`) e falha de upload — os três jeitos pelos
                  # quais este Job já falhou na prática. `$?` tem que ser lido
                  # antes de qualquer outro comando.
                  trap 'rc=$?; if [ "$rc" -ne 0 ]; then python3 /usr/local/bin/registrar_saude.py backup falha "job terminou com exit $rc"; fi' EXIT
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  dump="/tmp/${POSTGRES_DB}-${ts}.sql.gz"
                  echo "iniciando dump de ${POSTGRES_DB}"
                  # `pg_dump` NÃO lê POSTGRES_PASSWORD nem lê a env do servidor:
                  # ele usa PGPASSWORD (ou .pgpass). Sem isso o Job falha com
                  # "fe_sendauth: no password supplied" — e gerou um dump de 0
                  # bytes, que o upload recusou (o guarda funcionou).
                  #
                  # `export` em vez de prefixo inline: assim a senha não aparece
                  # na linha de comando visível em `ps` dentro do pod.
                  export PGPASSWORD="${POSTGRES_PASSWORD}"
                  pg_dump --host={{ include "postgresql.fullname" . }} \
                          --username="${POSTGRES_USER}" \
                          --dbname="${POSTGRES_DB}" \
                          --format=custom | gzip -6 > "${dump}"
                  echo "dump gerado: $(wc -c < "${dump}") bytes"
                  # Falha fechado: um dump de 0 bytes não é backup.
                  test -s "${dump}"
                  # Upload por script Python (boto3): a imagem não tem `mc` nem
                  # `aws` CLI. A chave é a de VERIFICAÇÃO, não a de ingest —
                  # backup escreve em `backup/`, não em `raw/`.
                  #
                  # Sem `|| echo`: falha de upload tem que falhar o Job. Um dump
                  # que só existe em /tmp e some no fim do pod não é backup.
                  python3 /usr/local/bin/upload_s3.py "${dump}" "backup/postgres"
                  echo "backup enviado"
                  # Registra o sucesso ANTES de sair: sem isso, a tabela `saude`
                  # nunca sabe que o backup funcionou, e "nenhum sucesso
                  # registrado" fica indistinguível de "nunca rodou".
                  python3 /usr/local/bin/registrar_saude.py backup ok \
                    "dump de $(wc -c < "${dump}") bytes enviado a backup/postgres"
                  echo "concluído"
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
{{- end }}
