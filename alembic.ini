[alembic]
script_location = src/lakecore/db/migrations
prepend_sys_path = src
version_path_separator = os

# A URL real vem de LAKECORE_DATABASE_URL (ou lakecore.ini). Nunca de segredo
# commitado: por política do projeto, credencial vive em variável de ambiente.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
