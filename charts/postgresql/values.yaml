# PostgreSQL — catálogo do lake.

image:
  repository: postgres
  #: Major pinado. Subir major exige `pg_upgrade`; não é mudança de values.
  tag: "16"
  pullPolicy: IfNotPresent

#: `shared_buffers` derivado do engine tier: 25% da RAM disponível é a regra
#: usual do PostgreSQL, e acima disso o ganho é marginal.
tier: standard
resources:
  micro:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}
    sharedBuffers: 256MB
  standard:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 3Gi}
    sharedBuffers: 512MB

persistence:
  size: 10Gi
  #: Vazio = storageclass padrão do cluster (microk8s-hostpath na Onda 3).
  storageClass: ""

auth:
  #: Nome da Secret com POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB.
  #: Criada fora do chart: credencial gerada pelo Helm vaza em `helm get values`.
  existingSecret: lakecore-db-secret
  database: lakecore

backup:
  enabled: true
  #: Diário às 03:00. `pg_dump` não é backup contínuo — é o que se testa em
  #: 5 minutos. O restore drill (Onda 6) é o que prova que serve.
  schedule: "0 3 * * *"
  #: Retenção em dias, aplicada pelo próprio Job ao final do dump.
  retentionDays: 30
  image:
    # Imagem própria: `postgres:16` + `boto3`. Ver docker/backup/Dockerfile.
    # Em offline usa `lakecore-backup` (importada no containerd pelo bundle);
    # em online `install.sh --fonte online` aponta para
    # `ghcr.io/theseeds/lakecore-backup`. O valor aqui é o padrão (offline).
    repository: lakecore-backup
    # v1.0.0: alinhado à versão do lake.
    tag: "1.0.0"
    # `Never`, não `IfNotPresent`. Descoberto em 2026-11-18: uma tag que existe
    # no containerd mas aponta para um fragmento inválido (página HTML de 404 de
    # um pull anterior) é aceita por `IfNotPresent` sem validação, e o pod
    # falha com "unexpected media type text/html" — erro que não menciona
    # backup e custou horas. Com `Never`, ou a imagem local é boa, ou o erro
    # diz claramente que ela não está lá (`ErrImageNeverPull`).
    #
    # Custo: a imagem precisa ser importada no nó antes do primeiro uso. É o
    # que a instalação offline faz de qualquer forma (Onda 7), e é honesto:
    # este lake não depende de registry. Em `--fonte online` o install.sh
    # sobrepõe este valor com `IfNotPresent` + repositório GHCR.
    pullPolicy: Never

#: `pg_dump` acima; estas são as demais rotinas.
maintenance:
  #: `VACUUM ANALYZE` semanal. `VACUUM FULL` NUNCA: trava a tabela inteira.
  vacuumSchedule: "0 4 * * 0"
