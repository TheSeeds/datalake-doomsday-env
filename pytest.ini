[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    error
    # O adaptador de datetime do driver sqlite3 está deprecado no Python 3.12+.
    # É ruído do driver, não do projeto: o alvo de produção é PostgreSQL.
    # Silenciado apenas aqui, não no código — e só para o dialeto de teste.
    ignore:The default datetime adapter is deprecated:DeprecationWarning
