apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
data:
  #: Apenas `pg_hba` vai aqui. `postgresql.conf` fica nos `args` do StatefulSet
  #: para que `shared_buffers` acompanhe o tier sem editar dois lugares.
  pg_hba.conf: |
    local   all             all                                     trust
    host    all             all             127.0.0.1/32            scram-sha-256
    host    all             all             ::1/128                 scram-sha-256
    #: Apenas a rede do cluster. Abrir 0.0.0.0/0 num lake é entregar o catálogo.
    host    all             all             10.0.0.0/8              scram-sha-256
    host    all             all             172.16.0.0/12           scram-sha-256
    host    all             all             192.168.0.0/16          scram-sha-256
