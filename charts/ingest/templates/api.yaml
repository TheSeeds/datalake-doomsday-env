apiVersion: v1
kind: Service
metadata:
  name: {{ include "ingest.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingest.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ingest.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ingest.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingest.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "ingest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ingest.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "ingest.env" . | nindent 12 }}
          # Probe de prontidão exercita banco de verdade (`/health` faz SELECT 1).
          # A lição do `pg_isready` da Onda 3: probe que não toca o mecanismo
          # passa sem testar nada.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # `/tmp` gravável para o upload HTTP (o domínio resolve arquivo local).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
