apiVersion: v1
kind: Service
metadata:
  name: {{ include "garage.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "garage.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.service.s3.port }}
      targetPort: s3
      protocol: TCP
    - name: rpc
      port: 3901
      targetPort: rpc
      protocol: TCP
