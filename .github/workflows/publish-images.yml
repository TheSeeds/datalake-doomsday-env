# Publica as imagens próprias do lake no GHCR quando uma TAG de release é criada.
#
# POR QUE VIA CI (e não manual):
#   build de imagem é passo de release, não de máquina local. Rodar na CI garante
#   que duas pessoas nunca "empurrem o que buildaram na própria casa": o artefato
#   sai de um ambiente controlado, com o código da tag, e fica versionado por
#   semver. O `docker login`/PAT deixa de ser responsabilidade de quem publica.
#
# COMO FUNCIONA:
#   - Dispara em `push` de tag `v*` (ex.: v1.0.0, v1.1.0). É o mesmo evento do
#     release; se há tag, há release, e as imagens precisam existir no GHCR.
#   - A tag de imagem é a TAG GIT sem o prefixo `v` (`v1.0.0` → `1.0.0`), alinhada
#     ao semver dos charts e do bundle (regra de `docs/release.md`).
#   - Autenticação no GHCR via um PAT com `write:packages`, guardado como secret
#     `GHCR_TOKEN`/`GHCR_USER` no repositório. Por que não GITHUB_TOKEN: em ORG o
#     token de repositório NÃO consegue empurrar pacotes da org (denied); o PAT
#     clássico com write:packages resolve. O secret nunca aparece em texto.
#   - Plataforma: `linux/amd64` — o único alvo homologado do v1 (ver
#     `docs/arquitetura-v2.md` §8.4 e o bundle, que é amd64-only). Adicionar arm64
#     é possível depois com `buildx --set platform`.

name: publish-images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag ou versão a publicar (ex.: 1.0.0)"
        required: false
        default: ""

jobs:
  publish:
    name: Build + push GHCR (lakecore-ingest, lakecore-backup)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY: ghcr.io
      ORG: theseeds
    steps:
      - uses: actions/checkout@v4

      # Extrai a versão semver da tag git. `v1.0.0` (git) → `1.0.0` (imagem).
      # Em workflow_dispatch, aceita o input manual; senão usa a tag.
      - name: Resolver versão (tag git ou input manual)
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "VER=${{ inputs.tag }}"
            echo "VER=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            REF="${GITHUB_REF_NAME}"
            VER="${REF#v}"
            echo "VER=${VER}"
            echo "VER=${VER}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Em org, o GITHUB_TOKEN de repositório NÃO consegue empurrar pacotes da
          # org (denied). Por isso usa-se um PAT com escopo write:packages, guardado
          # como secret GHCR_TOKEN no repo. Não há segredo em texto no repositório.
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build e push lakecore-ingest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/lakecore-ingest:${{ steps.ver.outputs.VER }}

      - name: Build e push lakecore-backup
        uses: docker/build-push-action@v6
        with:
          # `context` aponta para o subdiretório do Dockerfile; `file` é relativo
          # ao CONTEXT (não ao root do repo). Assim o COPY de upload_s3.py etc.
          # (relativos a docker/backup/) funciona, e evita o erro
          # "unable to prepare context: path ./docker/backup not found" quando se
          # mistura file=./docker/backup/Dockerfile com context=./docker/backup.
          context: ./docker/backup
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/lakecore-backup:${{ steps.ver.outputs.VER }}

      - name: Confirmar no GHCR
        run: |
          echo "Publicadas em ${REGISTRY}/${ORG}/:"
          echo "  lakecore-ingest:${VER}"
          echo "  lakecore-backup:${VER}"
          docker buildx imagetools inspect "${REGISTRY}/${ORG}/lakecore-ingest:${VER}" >/dev/null \
            && echo "lakecore-ingest confirmada no GHCR"
        env:
          VER: ${{ steps.ver.outputs.VER }}
