name: datalake-env CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  PG_SERVICE_URL: postgresql+psycopg://lakecore:teste123@127.0.0.1:5432/lakecore

jobs:
  # SQLite em memória: rápido, sem serviço. É o piso que precisa ficar verde
  # sempre, inclusive em máquina de contribuidor sem Docker.
  unit:
    name: lakecore (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements*.txt') }}

      - name: Testes (sem PostgreSQL)
        run: make test

  # O alvo real. SQLite e PostgreSQL divergem em JSONB, GIN, CHECK e ALTER
  # COLUMN — testar só em SQLite esconde exatamente o que quebra no cluster.
  postgres:
    name: lakecore + catálogo (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: lakecore
          POSTGRES_USER: lakecore
          POSTGRES_PASSWORD: teste123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-pg-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements*.txt') }}

      - name: Suíte completa contra PostgreSQL
        env:
          LAKECORE_TEST_PG_URL: ${{ env.PG_SERVICE_URL }}
        run: make test

      - name: Ciclo de migração upgrade -> downgrade -> upgrade
        env:
          LAKECORE_DATABASE_URL: ${{ env.PG_SERVICE_URL }}
        run: |
          PYTHONPATH=src .venv/bin/alembic upgrade head
          PYTHONPATH=src .venv/bin/alembic downgrade base
          PYTHONPATH=src .venv/bin/alembic upgrade head

  chart:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint (charts/*)
        run: |
          found=0
          for chart in charts/*/; do
            [ -f "${chart}Chart.yaml" ] || continue
            found=1
            echo "::group::lint ${chart}"
            helm lint "${chart}"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "Nenhum chart presente ainda (Onda 3+)."
          fi

  license:
    name: Licença e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nenhum segredo versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|secrets/|\.secret\.yaml$'; then
            echo "::error::arquivo sensível versionado"
            exit 1
          fi
          echo "ok: nenhum segredo versionado"

      - name: Apache 2.0 completo antes do release
        run: |
          if git describe --tags --exact-match >/dev/null 2>&1; then
            grep -q "Apache License" LICENSE
            grep -q "Version 2.0" LICENSE
            lines=$(wc -l < LICENSE)
            if [ "$lines" -lt 170 ]; then
              echo "::error::LICENSE sem o texto integral do Apache 2.0 em tag de release"
              exit 1
            fi
          else
            echo "sem tag de release: LICENSE com aviso apenas (ok por ora)"
          fi
